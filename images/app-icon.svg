<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The app picture: a swirly lollipop on a pink and purple background -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7ab8"/>
      <stop offset="1" stop-color="#b28dff"/>
    </linearGradient>
    <clipPath id="sweet">
      <circle cx="256" cy="210" r="120"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- Lollipop stick -->
  <rect x="242" y="300" width="28" height="140" rx="14" fill="#fff8ee"/>

  <!-- Lollipop sweet with a rainbow swirl -->
  <circle cx="256" cy="210" r="120" fill="#fff"/>
  <g clip-path="url(#sweet)" fill="none" stroke-width="30" stroke-linecap="round">
    <path d="M256 210 m0 -15 a15 15 0 1 1 -15 15 a30 30 0 0 1 30 -30 a45 45 0 0 1 45 45 a60 60 0 0 1 -60 60 a75 75 0 0 1 -75 -75 a90 90 0 0 1 90 -90 a105 105 0 0 1 105 105" stroke="#ff4f9a"/>
    <path d="M256 210 m0 15 a15 15 0 1 1 15 -15 a30 30 0 0 1 -30 30 a45 45 0 0 1 -45 -45 a60 60 0 0 1 60 -60 a75 75 0 0 1 75 75 a90 90 0 0 1 -90 90 a105 105 0 0 1 -105 -105" stroke="#7ad8ff"/>
  </g>
  <circle cx="256" cy="210" r="120" fill="none" stroke="#fff" stroke-width="8"/>
  <ellipse cx="205" cy="150" rx="22" ry="12" fill="#fff" opacity=".7" transform="rotate(-35 205 150)"/>

  <!-- Bow on the stick -->
  <path d="M256 330 L206 305 L206 355 Z" fill="#ffd23f"/>
  <path d="M256 330 L306 305 L306 355 Z" fill="#ffd23f"/>
  <circle cx="256" cy="330" r="12" fill="#ffb800"/>

  <!-- Sparkles -->
  <g fill="#fff">
    <path d="M110 110 l8 22 l22 8 l-22 8 l-8 22 l-8 -22 l-22 -8 l22 -8 Z"/>
    <path d="M400 330 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 Z"/>
    <path d="M395 105 l5 13 l13 5 l-13 5 l-5 13 l-5 -13 l-13 -5 l13 -5 Z"/>
  </g>
</svg>
